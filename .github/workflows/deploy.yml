name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Install Cloudflare Tunnel client on GitHub Actions runner
      - name: Install cloudflared
        run: |
          curl -L --fail \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb || sudo apt-get install -f -y

      # Configure SSH and Cloudflare Access
      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_SERVICE_TOKEN_ID: ${{ secrets.CF_SERVICE_TOKEN_ID }}
          CF_SERVICE_TOKEN_SECRET: ${{ secrets.CF_SERVICE_TOKEN_SECRET }}

        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/config <<EOF
          Host homeserver
            HostName ${SSH_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
          EOF

          chmod 600 ~/.ssh/config

          {
            echo "TUNNEL_SERVICE_TOKEN_ID<<EOF"
            echo "$CF_SERVICE_TOKEN_ID"
            echo "EOF"

            echo "TUNNEL_SERVICE_TOKEN_SECRET<<EOF"
            echo "$CF_SERVICE_TOKEN_SECRET"
            echo "EOF"
          } >> "$GITHUB_ENV"

      # Deploy application on the production server
      - name: Deploy on server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

        run: |
          set -euo pipefail

          ssh homeserver "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
            set -euo pipefail

            # Navigate to application directory
            cd "${DEPLOY_PATH:?DEPLOY_PATH is required}"

            # Fetch and mirror origin/main exactly.
            # Untracked root .env remains untouched.
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main

            # Install dependencies as SSH user (no sudo)
            pnpm install --frozen-lockfile

            # Run production database migrations (no sudo)
            pnpm run db:migrate:deploy

            # Build production application (no sudo)
            pnpm run build

            # Restart application using passwordless sudo
            sudo -n systemctl restart fannout

            # Verify systemd service is active
            sudo -n systemctl is-active fannout

            echo "Deployment completed successfully."
          REMOTE
